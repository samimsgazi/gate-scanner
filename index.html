<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stadium Multi-Gate System</title>
  
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
    
    .nav {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 10px; background: #16181f; border-bottom: 1px solid #282c37;
    }
    select {
      font-size: 15px; font-weight: 700; padding: 8px 12px;
      border-radius: 6px; background: #252836; color: #fff; border: 1px solid #3b4054; width: 100%;
    }
    
    #connection-bar {
      font-size: 12px; font-weight: 600; padding: 4px;
      background: #059669; color: #fff; transition: background 0.3s;
    }
    .offline-mode { background: #d97706 !important; }

    #reader { width: 100%; max-width: 360px; margin: 8px auto; border-radius: 12px; overflow: hidden; }

    #display-box {
      position: fixed; bottom: 0; left: 0; right: 0; height: 42%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: #16181f; font-size: 26px; font-weight: 900; text-transform: uppercase;
      padding: 15px; border-top: 2px solid #333;
    }
    .VALID { background: #059669 !important; border-top-color: #34d399 !important; }
    .WRONG_DAY { background: #d97706 !important; border-top-color: #fbbf24 !important; }
    .WRONG_GATE { background: #7c3aed !important; border-top-color: #a78bfa !important; }
    .DUPLICATE { background: #dc2626 !important; border-top-color: #f87171 !important; }
    .FAKE { background: #881337 !important; border-top-color: #fb7185 !important; }
    .details { font-size: 16px; font-weight: 500; margin-top: 8px; text-transform: none; opacity: 0.9; }
  </style>
</head>
<body>

  <div id="connection-bar">● Connecting to Database...</div>

  <div class="nav">
    <div>
      <select id="selDay">
        <option value="1">DAY 1</option>
        <option value="2">DAY 2</option>
      </select>
    </div>
    <div>
      <select id="selGate">
        <option value="NORTH">Gate North</option>
        <option value="SOUTH">Gate South</option>
        <option value="EAST">Gate East</option>
        <option value="WEST">Gate West</option>
        <option value="ANY">Any Gate (All)</option>
      </select>
    </div>
  </div>

  <div id="reader"></div>

  <div id="display-box">
    <span>READY TO SCAN</span>
    <div class="details">Point camera at attendee pass</div>
  </div>

  <script>
    // Configured with your exact Supabase credentials
    const SUPABASE_URL = 'https://jmoirptaskuzshorucgz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imptb2lycHRhc2t1enNob3J1Y2d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NTg3OTQsImV4cCI6MjEwNjMzNDc5NH0.X_01QYVFTyEATApBBffGplR5u0bnh0nVolywc4_9d74';
    const HMAC_SECRET  = 'STADIUM_SUPER_SECRET_KEY_2026';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const localCheckedIn = new Set();
    const display = document.getElementById('display-box');
    const connBar = document.getElementById('connection-bar');
    let locked = false;

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function sound(hz, duration) {
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = hz;
        osc.start();
        setTimeout(() => osc.stop(), duration);
      } catch(e) {}
    }

    // Real-Time Cross-Gate Sync via Supabase WebSockets
    supabaseClient
      .channel('gate_sync')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stadium_tickets' }, (payload) => {
        if (payload.new && payload.new.status === 'SCANNED') {
          localCheckedIn.add(payload.new.code);
        }
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          connBar.innerText = '● Database Connected (Live Real-Time)';
          connBar.classList.remove('offline-mode');
        } else {
          connBar.innerText = '○ Offline Mode (Verifying Cryptographically)';
          connBar.classList.add('offline-mode');
        }
      });

    async function verifySignature(payload, sig) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey(
        'raw', enc.encode(HMAC_SECRET),
        { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']
      );
      let b64 = sig.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const sigBytes = new Uint8Array([...window.atob(b64)].map(c => c.charCodeAt(0)));
      return await crypto.subtle.verify('HMAC', key, sigBytes, enc.encode(payload));
    }

    async function handleScan(decodedText) {
      if (locked) return;
      locked = true;

      const [payload, sig] = decodedText.split('.');
      if (!payload || !sig) {
        show('FAKE', 'INVALID CODE', 'Not a recognized match ticket');
        sound(150, 400);
        return unlock(1000);
      }

      const [ticketId, ticketDay, ticketGate, category] = payload.split('|');
      const activeDay = parseInt(document.getElementById('selDay').value);
      const activeGate = document.getElementById('selGate').value;

      // 1. Digital Signature Check
      const validSig = await verifySignature(payload, sig);
      if (!validSig) {
        show('FAKE', 'COUNTERFEIT TICKET', 'Security signature mismatch');
        sound(150, 500);
        return unlock(1200);
      }

      // 2. Event Day Check
      if (parseInt(ticketDay) !== activeDay) {
        show('WRONG_DAY', `WRONG DAY! (Day ${ticketDay})`, `Ticket valid ONLY for Day ${ticketDay}`);
        sound(350, 350);
        return unlock(1200);
      }

      // 3. Gate Check
      if (activeGate !== 'ANY' && ticketGate !== 'ANY' && ticketGate !== activeGate) {
        show('WRONG_GATE', `GO TO ${ticketGate} GATE`, `This pass is assigned to Gate ${ticketGate}`);
        sound(450, 350);
        return unlock(1400);
      }

      // 4. In-Memory Duplicate Check
      if (localCheckedIn.has(ticketId)) {
        show('DUPLICATE', 'ALREADY SCANNED', 'Entry registered previously');
        sound(220, 500);
        return unlock(1200);
      }

      // 5. Cloud Database Atomic Check-in
      try {
        const { data, error } = await supabaseClient
          .from('stadium_tickets')
          .update({
            status: 'SCANNED',
            scanned_at: new Date().toISOString(),
            scanned_by_gate: activeGate
          })
          .eq('code', ticketId)
          .eq('status', 'VALID')
          .select();

        if (error || !data || data.length === 0) {
          localCheckedIn.add(ticketId);
          show('DUPLICATE', 'ALREADY SCANNED', 'Used at another gate just now!');
          sound(220, 500);
          return unlock(1200);
        }
      } catch (err) {
        console.warn('Network issue; fallback to local check.');
      }

      localCheckedIn.add(ticketId);
      show('VALID', 'ACCESS GRANTED', `${ticketId} • Gate ${ticketGate}`);
      sound(880, 150);
      unlock(600);
    }

    function show(cls, title, sub) {
      display.className = cls;
      display.innerHTML = `<span>${title}</span><div class="details">${sub}</div>`;
    }

    function unlock(ms) {
      setTimeout(() => {
        locked = false;
        display.className = '';
        display.innerHTML = '<span>READY TO SCAN</span><div class="details">Point camera at attendee pass</div>';
      }, ms);
    }

    new Html5QrcodeScanner("reader", {
      fps: 25,
      qrbox: { width: 220, height: 220 },
      aspectRatio: 1.0
    }).render(handleScan);
  </script>
</body>
</html>
